database:
  driver: postgres
  host: localhost
  port: 5432
  user: postgres
  password: 123
  dbname: ecommerce_db
  sqlite_path: ./ecommerce.sqlite
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300

server:
  host: localhost
  port: 8000
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120
  max_header_bytes: 1048576

admin:
  enabled: true
  path: /admin/
  title: Forge Ecommerce Admin
  items_per_page: 20

api:
  enabled: true
  path: /api/v1/
  default_page_size: 20
  max_page_size: 100

security:
  session_secret: change-me-in-production-with-random-string
  csrf_secret_key: change-me-in-production-with-random-string
  session_lifetime: 86400 # 24 hours

logging:
  level: info # debug, info, warn, error
  format: json # json, console
  output: stdout # stdout, stderr, file

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:8000
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Accept
    - Authorization
    - Content-Type
    - X-CSRF-Token
  exposed_headers:
    - X-Total-Count
  allow_credentials: true
  max_age: 3600

# Application-specific settings
ecommerce:
  currency: USD
  tax_rate: 0.08 # 8%
  shipping_cost: 10.00
  free_shipping_threshold: 100.00
  low_stock_threshold: 10
  order_expiry_hours: 24
  enable_reviews: true
  enable_wishlist: true
  enable_coupons: true
