# golangci-lint v2; preserve the existing focused CI checks.
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - misspell
    - ineffassign
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - vendor
      - examples
      - cmd/forge
      - '.*\.gen\.go$'
issues:
  max-issues-per-linter: 50
  max-same-issues: 3
severity:
  default: error
  rules:
    - linters:
        - misspell
      severity: warning
