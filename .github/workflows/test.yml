name: Tests

on:
  workflow_dispatch:
    inputs:
      no_db:
        description: Force a database connection failure to exercise the release gate
        type: boolean
        default: false
  push:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'forge/admin/ui/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'forge/admin/ui/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            frontend:
              - 'forge/admin/ui/**'
            workflows:
              - '.github/workflows/test.yml'

  unit-tests:
    name: Unit Tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'

    strategy:
      matrix:
        go-version: ['1.26.8', '1.27.1']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: '**/go.sum'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: forge
        run: go mod download

      - name: Run unit tests
        working-directory: forge
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./forge/coverage.out
          flags: unittests
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('tests/go.sum', 'forge/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: tests
        run: go mod download

      - name: Run integration tests
        working-directory: tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123"
        run: go test -v -timeout 15m ./integration/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: forge
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'

      - name: Build all packages
        working-directory: forge
        run: go build ./...

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          cache: 'npm'
          cache-dependency-path: forge/admin/ui/web/package-lock.json

      - name: Install dependencies
        working-directory: forge/admin/ui/web
        run: npm ci

      - name: Build frontend
        working-directory: forge/admin/ui/web
        run: npm run build

      - name: Lint
        working-directory: forge/admin/ui/web
        run: npm run lint

      - name: Run frontend tests
        working-directory: forge/admin/ui/web
        run: npm run test -- --run

  cli-e2e:
    name: CLI E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('tests/go.sum', 'forge/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: forge
        run: go mod download

      - name: Build forge CLI
        working-directory: forge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/forge" ./cli/cmd
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Run CLI e2e tests
        working-directory: tests
        env:
          RUN_POSTGRES_TESTS: "1"
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123"
        run: go test -v ./e2e/cli/...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: forge

  release-gate:
    name: Release evidence gate
    runs-on: ubuntu-latest
    env:
      FORGE_REQUIRE_DB: '1'
      FORGE_TEST_DATABASE_URL: ${{ inputs.no_db && 'postgres://x@127.0.0.1:1/x' || 'postgres://forge_test:forge_test@localhost:5432/forge_test?sslmode=disable' }}
      POSTGRES_USER: ${{ inputs.no_db && '' || 'forge_test' }}
      POSTGRES_PASSWORD: ${{ inputs.no_db && '' || 'forge_test' }}
      POSTGRES_HOST: ${{ inputs.no_db && '' || 'localhost' }}
      POSTGRES_PORT: ${{ inputs.no_db && '' || '5432' }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: forge_test
          POSTGRES_PASSWORD: forge_test
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U forge_test -d forge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'

      - name: Build test reporter
        id: reporter
        working-directory: forge
        run: go build -o "$RUNNER_TEMP/testreport" ./internal/tools/testreport

      - name: Collect forge release evidence
        working-directory: forge
        run: |
          set -o pipefail
          # Run package binaries serially (-p 1) because all packages share FORGE_TEST_DATABASE_URL and CleanupDB truncates tables.
          go test -count=1 -p 1 -json ./... | "$RUNNER_TEMP/testreport" --out "$RUNNER_TEMP/forge-report.txt" --require-no-skip '^github.com/.*/(identity|internal/testutils)'

      - name: Collect integration release evidence
        if: ${{ !cancelled() && steps.reporter.outcome == 'success' }}
        working-directory: tests
        run: |
          set -o pipefail
          # Run package binaries serially (-p 1) because all packages share FORGE_TEST_DATABASE_URL and CleanupDB truncates tables.
          go test -count=1 -p 1 -json ./... | "$RUNNER_TEMP/testreport" --out "$RUNNER_TEMP/tests-report.txt" --require-no-skip '^github.com/forgego/forge/tests/(integration|pkg_migrations|e2e)' --allow-skip 'tests/pkg_migrations$ ^TestMigrationApplySQLite$'

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-reports
          path: |
            ${{ runner.temp }}/forge-report.txt
            ${{ runner.temp }}/tests-report.txt
