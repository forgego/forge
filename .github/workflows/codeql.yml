name: CodeQL Analysis

on:
  push:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'forge/admin/ui/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'forge/admin/ui/**'
      - '.github/workflows/codeql.yml'
  schedule:
    # Run at 3 AM UTC every Monday
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.force.outputs.go || steps.filter.outputs.go }}
      js: ${{ steps.force.outputs.js || steps.filter.outputs.js }}
      workflows: ${{ steps.force.outputs.workflows || steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            js:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - 'docs-site/**'
              - 'forge/admin/ui/**'
            workflows:
              - '.github/workflows/codeql.yml'
      - name: Force all checks on schedule or manual runs
        id: force
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "js=true" >> "$GITHUB_OUTPUT"
          echo "workflows=true" >> "$GITHUB_OUTPUT"

  analyze-go:
    name: Analyze Go
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
