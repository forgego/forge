name: Security Scan

on:
  push:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'forge/admin/ui/**'
      - 'examples/ecommerce/**'
      - '**/Dockerfile'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'forge/admin/ui/**'
      - 'examples/ecommerce/**'
      - '**/Dockerfile'
      - '.github/workflows/security.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.force.outputs.go || steps.filter.outputs.go }}
      docs: ${{ steps.force.outputs.docs || steps.filter.outputs.docs }}
      admin_ui: ${{ steps.force.outputs.admin_ui || steps.filter.outputs.admin_ui }}
      examples: ${{ steps.force.outputs.examples || steps.filter.outputs.examples }}
      docker: ${{ steps.force.outputs.docker || steps.filter.outputs.docker }}
      workflows: ${{ steps.force.outputs.workflows || steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            docs:
              - 'docs-site/**'
            admin_ui:
              - 'forge/admin/ui/**'
            examples:
              - 'examples/ecommerce/**'
            docker:
              - '**/Dockerfile'
              - 'examples/ecommerce/docker-compose.yml'
            workflows:
              - '.github/workflows/security.yml'
      - name: Force all checks on schedule or manual runs
        id: force
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "docs=true" >> "$GITHUB_OUTPUT"
          echo "admin_ui=true" >> "$GITHUB_OUTPUT"
          echo "examples=true" >> "$GITHUB_OUTPUT"
          echo "docker=true" >> "$GITHUB_OUTPUT"
          echo "workflows=true" >> "$GITHUB_OUTPUT"

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      
      - name: Run govulncheck on forge
        working-directory: forge
        run: govulncheck ./...
      
      - name: Run govulncheck on tests
        working-directory: tests
        run: govulncheck ./...
      
      - name: Run govulncheck on examples
        working-directory: examples/ecommerce
        run: govulncheck ./...

  gosec:
    name: Go Security Scanner
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Run Gosec Security Scanner
        continue-on-error: true
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif -exclude-dir=tests ./...'
          working-directory: forge
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.workflows == 'true' ||
      (matrix.directory == 'docs-site' && needs.changes.outputs.docs == 'true') ||
      (matrix.directory == 'forge/admin/ui/web' && needs.changes.outputs.admin_ui == 'true')
    strategy:
      matrix:
        directory: ['forge/admin/ui/web', 'docs-site']
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      
      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=moderate
      
      - name: Check for outdated packages
        working-directory: ${{ matrix.directory }}
        run: npm outdated || true

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: test
          working-directory: forge

  trivy:
    name: Trivy Security Scanner
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.admin_ui == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.docker == 'true' || needs.changes.outputs.examples == 'true' || needs.changes.outputs.workflows == 'true')
    steps:
      - uses: actions/checkout@v6
      
      - name: Build Docker image
        run: docker build -t forge-ecommerce:test -f examples/ecommerce/Dockerfile examples/ecommerce
      
      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'forge-ecommerce:test'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-docker-results.sarif'
          category: trivy-docker

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.examples == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v1
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./forge
            ./examples/ecommerce

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.admin_ui == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      
      - name: Check licenses
        working-directory: forge
        run: go-licenses report ./... --ignore github.com/forgego/forge

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
