name: Security Scan

on:
  push:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'admin/ui/**'
      - 'examples/ecommerce/**'
      - '**/Dockerfile'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main, master, v8]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'admin/ui/**'
      - 'examples/ecommerce/**'
      - '**/Dockerfile'
      - '.github/workflows/security.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.force.outputs.go || steps.filter.outputs.go }}
      docs: ${{ steps.force.outputs.docs || steps.filter.outputs.docs }}
      admin_ui: ${{ steps.force.outputs.admin_ui || steps.filter.outputs.admin_ui }}
      examples: ${{ steps.force.outputs.examples || steps.filter.outputs.examples }}
      docker: ${{ steps.force.outputs.docker || steps.filter.outputs.docker }}
      workflows: ${{ steps.force.outputs.workflows || steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            docs:
              - 'docs-site/**'
            admin_ui:
              - 'admin/ui/**'
            examples:
              - 'examples/ecommerce/**'
            docker:
              - '**/Dockerfile'
              - 'examples/ecommerce/docker-compose.yml'
            workflows:
              - '.github/workflows/security.yml'
      - name: Force all checks on schedule or manual runs
        id: force
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "docs=true" >> "$GITHUB_OUTPUT"
          echo "admin_ui=true" >> "$GITHUB_OUTPUT"
          echo "examples=true" >> "$GITHUB_OUTPUT"
          echo "docker=true" >> "$GITHUB_OUTPUT"
          echo "workflows=true" >> "$GITHUB_OUTPUT"

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      
      - name: Run govulncheck on the root module
        run: govulncheck ./...
      
      - name: Run govulncheck on tests
        working-directory: tests
        run: govulncheck ./...
      
      - name: Run govulncheck on examples
        working-directory: examples/ecommerce
        run: govulncheck ./...

  gosec:
    name: Go Security Scanner
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      
      - name: Run Gosec Security Scanner
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -fmt sarif -out gosec-results.sarif -exclude-dir=tests ./...
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.workflows == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.admin_ui == 'true'
    strategy:
      matrix:
        directory: ['admin/ui/web', 'docs-site']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Check if directory should be audited
        id: check_run
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ needs.changes.outputs.workflows }}" = "true" ] || \
             [ "${{ matrix.directory }}" = "docs-site" -a "${{ needs.changes.outputs.docs }}" = "true" ] || \
             [ "${{ matrix.directory }}" = "admin/ui/web" -a "${{ needs.changes.outputs.admin_ui }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check_run.outputs.should_run == 'true'
        with:
          node-version: '26.8.1'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      
      - name: Install dependencies
        if: steps.check_run.outputs.should_run == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm ci
      
      - name: Run npm audit
        if: steps.check_run.outputs.should_run == 'true'
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${{ matrix.directory }}" = "docs-site" ]; then
            # Docusaurus is used only to build static docs. Its dev-only braces
            # dependency has no patched release, so audit shipped dependencies.
            npm audit --omit=dev --audit-level=moderate
          else
            npx -y better-npm-audit audit --level=moderate
          fi
      
      - name: Check for outdated packages
        if: steps.check_run.outputs.should_run == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm outdated || true

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=go.mod
          command: test

  trivy:
    name: Trivy Security Scanner
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.admin_ui == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.docker == 'true' || needs.changes.outputs.examples == 'true' || needs.changes.outputs.workflows == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Build Docker image
        run: docker build -t forge-ecommerce:test -f examples/ecommerce/Dockerfile .
      
      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'forge-ecommerce:test'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: 'trivy-docker-results.sarif'
          category: trivy-docker

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.examples == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            scan
            source
            --lockfile=go.mod
            --recursive
            --skip-git
            ./admin/ui/web
            ./examples/ecommerce

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.admin_ui == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          extra_args: --debug --only-verified

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      
      - name: Check licenses
        run: go-licenses report ./... --ignore github.com/forgego/forge

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
