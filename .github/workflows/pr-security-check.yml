name: PR Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'forge/admin/ui/**'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '.github/workflows/pr-security-check.yml'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
      admin_ui: ${{ steps.filter.outputs.admin_ui }}
      deps: ${{ steps.filter.outputs.deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            docs:
              - 'docs-site/**'
            admin_ui:
              - 'forge/admin/ui/**'
            deps:
              - '**/go.mod'
              - '**/go.sum'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
            workflows:
              - '.github/workflows/pr-security-check.yml'

  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: forge
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... > vuln-report.txt 2>&1 || true
          if [ -s vuln-report.txt ]; then
            echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT
            cat vuln-report.txt
          else
            echo "vulnerabilities_found=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.admin_ui == 'true' || needs.changes.outputs.workflows == 'true'
        with:
          config: >-
            p/security-audit
            p/golang
            p/owasp-top-ten
            p/sql-injection
            p/xss
      
      - name: Check sensitive file changes
        id: sensitive_files
        run: |
          SENSITIVE_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '(\.env|config\.ya?ml|secrets|credentials|\.pem|\.key|\.p12)' || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "sensitive_files_changed=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$SENSITIVE_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "sensitive_files_changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on PR
        if: steps.sensitive_files.outputs.sensitive_files_changed == 'true' || steps.govulncheck.outputs.vulnerabilities_found == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            let message = '## ⚠️ Security Review\n\n';
            
            if ('${{ steps.govulncheck.outputs.vulnerabilities_found }}' === 'true') {
              message += '### 🔴 Vulnerabilities Found\n\n';
              message += 'Go vulnerability scanner found issues. Please check the workflow logs.\n\n';
            }
            
            if ('${{ steps.sensitive_files.outputs.sensitive_files_changed }}' === 'true') {
              message += '### 🟡 Sensitive Files Modified\n\n';
              message += 'The following sensitive files were modified:\n\n';
              message += '```\n${{ steps.sensitive_files.outputs.files }}\n```\n\n';
              message += 'Please ensure:\n';
              message += '- No secrets are hardcoded\n';
              message += '- Configuration values are safe for public repository\n';
              message += '- Sensitive data uses environment variables\n\n';
            }
            
            message += '---\n';
            message += '*This is an automated security check. Please review carefully before merging.*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
          comment-summary-in-pr: always

  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Run staticcheck
        continue-on-error: true
        working-directory: forge
        run: staticcheck ./...
      
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
      
      - name: Run golangci-lint
        working-directory: forge
        run: golangci-lint run --timeout=5m --config=../.golangci.yml

  npm-security:
    name: NPM Security Check
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.workflows == 'true' ||
      (matrix.directory == 'docs-site' && needs.changes.outputs.docs == 'true') ||
      (matrix.directory == 'forge/admin/ui/web' && needs.changes.outputs.admin_ui == 'true')
    strategy:
      matrix:
        directory: ['forge/admin/ui/web', 'docs-site']
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      
      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=moderate
      
      - name: Check for known vulnerabilities
        working-directory: ${{ matrix.directory }}
        run: npx better-npm-audit audit --level=moderate
