name: PR Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'docs-site/**'
      - 'forge/admin/ui/**'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '.github/workflows/pr-security-check.yml'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
      admin_ui: ${{ steps.filter.outputs.admin_ui }}
      deps: ${{ steps.filter.outputs.deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            docs:
              - 'docs-site/**'
            admin_ui:
              - 'forge/admin/ui/**'
            deps:
              - '**/go.mod'
              - '**/go.sum'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
            workflows:
              - '.github/workflows/pr-security-check.yml'

  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      
      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: forge
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          if govulncheck ./... > vuln-report.txt 2>&1; then
            echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
            cat vuln-report.txt
            exit 1
          fi
          cat vuln-report.txt
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          extra_args: --debug --only-verified
      
      - name: Install Semgrep
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.admin_ui == 'true' || needs.changes.outputs.workflows == 'true'
        run: pipx install semgrep==1.176.1

      - name: Run Semgrep
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.admin_ui == 'true' || needs.changes.outputs.workflows == 'true'
        run: semgrep scan --error --baseline-commit=${{ github.event.pull_request.base.sha }} --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag --config p/security-audit --config p/golang --config p/owasp-top-ten --config p/sql-injection --config p/xss

      - name: Check sensitive file changes
        id: sensitive_files
        run: |
          SENSITIVE_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '(\.env|config\.ya?ml|secrets|credentials|\.pem|\.key|\.p12)' || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "sensitive_files_changed=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$SENSITIVE_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "sensitive_files_changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on PR
        if: steps.sensitive_files.outputs.sensitive_files_changed == 'true' || steps.govulncheck.outputs.vulnerabilities_found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SENSITIVE_FILES: ${{ steps.sensitive_files.outputs.files }}
        with:
          script: |
            let message = '## ⚠️ Security Review\n\n';
            
            if ('${{ steps.govulncheck.outputs.vulnerabilities_found }}' === 'true') {
              message += '### 🔴 Vulnerabilities Found\n\n';
              message += 'Go vulnerability scanner found issues. Please check the workflow logs.\n\n';
            }
            
            if ('${{ steps.sensitive_files.outputs.sensitive_files_changed }}' === 'true') {
              message += '### 🟡 Sensitive Files Modified\n\n';
              message += 'The following sensitive files were modified:\n\n';
              message += '```\n' + process.env.SENSITIVE_FILES + '\n```\n\n';
              message += 'Please ensure:\n';
              message += '- No secrets are hardcoded\n';
              message += '- Configuration values are safe for public repository\n';
              message += '- Sensitive data uses environment variables\n\n';
            }
            
            message += '---\n';
            message += '*This is an automated security check. Please review carefully before merging.*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
          comment-summary-in-pr: always

  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l forge tests examples/ecommerce)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      
      - name: Run staticcheck
        working-directory: forge
        run: staticcheck ./...
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: forge
          args: --timeout=5m --config=../.golangci.yml

  npm-security:
    name: NPM Security Check
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.workflows == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.admin_ui == 'true'
    strategy:
      matrix:
        directory: ['forge/admin/ui/web', 'docs-site']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Check if directory should be audited
        id: check_run
        run: |
          if [ "${{ needs.changes.outputs.workflows }}" = "true" ] || \
             [ "${{ matrix.directory }}" = "docs-site" -a "${{ needs.changes.outputs.docs }}" = "true" ] || \
             [ "${{ matrix.directory }}" = "forge/admin/ui/web" -a "${{ needs.changes.outputs.admin_ui }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check_run.outputs.should_run == 'true'
        with:
          node-version: '26.8.1'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      
      - name: Install dependencies
        if: steps.check_run.outputs.should_run == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm ci
      
      - name: Run npm audit
        if: steps.check_run.outputs.should_run == 'true'
        working-directory: ${{ matrix.directory }}
        run: npx -y better-npm-audit audit --level=moderate
