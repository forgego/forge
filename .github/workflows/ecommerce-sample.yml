name: Ecommerce Sample

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'examples/ecommerce/**'
      - 'forge/**'
      - '.github/workflows/ecommerce-sample.yml'
  pull_request:
    paths:
      - 'examples/ecommerce/**'
      - 'forge/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Ecommerce Sample
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            forge/go.sum
            examples/ecommerce/go.sum

      - name: Download dependencies
        working-directory: examples/ecommerce
        run: go mod download

      - name: Build ecommerce sample
        working-directory: examples/ecommerce
        run: go build -o ecommerce .

      - name: Run database setup
        working-directory: examples/ecommerce
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        run: |
          echo "Testing database connection..."
          psql -h localhost -U postgres -d postgres -c "SELECT version();"

      - name: Run tests
        working-directory: examples/ecommerce
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        run: go test -v ./...

      - name: Build Docker image
        run: docker build -t ecommerce-sample:${{ github.sha }} -f examples/ecommerce/Dockerfile examples/ecommerce

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-binary
          path: examples/ecommerce/ecommerce
          retention-days: 7

  integration-test:
    name: Integration Test (Full Stack)
    runs-on: ubuntu-latest
    needs: build-and-test
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download ecommerce binary
        uses: actions/download-artifact@v4
        with:
          name: ecommerce-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/ecommerce

      - name: Create config file
        working-directory: examples/ecommerce
        run: |
          mkdir -p config
          cat > config/config.yaml << EOF
          database:
            host: localhost
            port: 5432
            user: postgres
            password: postgres
            dbname: ecommerce
            sslmode: disable
          
          server:
            port: 8000
            host: 0.0.0.0
          EOF

      - name: Run server in background
        working-directory: examples/ecommerce
        run: |
          ../../bin/ecommerce &
          echo $! > server.pid
          sleep 5

      - name: Test admin interface
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/admin/ > /dev/null 2>&1; then
              echo "Admin interface is accessible"
              exit 0
            fi
            sleep 1
          done
          echo "Failed to access admin interface"
          exit 1

      - name: Test health endpoint
        run: |
          curl -f http://localhost:8000/health || exit 1

      - name: Stop server
        working-directory: examples/ecommerce
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
