name: Ecommerce Sample

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ecommerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('examples/ecommerce/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: examples/ecommerce
        run: go mod download

      - name: Smoke build
        working-directory: examples/ecommerce
        run: go build ./...

      - name: Build binary
        working-directory: examples/ecommerce
        run: |
          mkdir -p dist
          go build -o dist/ecommerce

      - name: Upload ecommerce artifact
        uses: actions/upload-artifact@v3
        with:
          name: ecommerce-sample
          path: |
            examples/ecommerce/dist/ecommerce
            examples/ecommerce/static
            examples/ecommerce/templates

  docker-ecommerce:
    runs-on: ubuntu-latest
    needs: build-ecommerce
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ecommerce-sample:${{ github.sha }} -f examples/ecommerce/Dockerfile examples/ecommerce

      - name: Save Docker image
        run: |
          docker save ecommerce-sample:${{ github.sha }} -o ecommerce-sample-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: ecommerce-sample-image
          path: ecommerce-sample-image.tar
