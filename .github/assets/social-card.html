<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1280px;height:640px;background:#0F172A;font-family:Inter,sans-serif;color:#F8FAFC;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-180px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(242,107,29,.22),rgba(242,107,29,0) 65%)}
.wrap{position:absolute;left:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:28px}
.brand img{width:132px;height:132px}
h1{font-size:112px;font-weight:800;letter-spacing:-3px;margin:0}
h2{font-size:44px;font-weight:600;margin:40px 0 0;color:#F8FAFC;letter-spacing:-.5px}
p{font-size:30px;font-weight:500;color:#94A3B8;margin:18px 0 0}
.url{position:absolute;left:96px;bottom:56px;font-family:'JetBrains Mono',monospace;font-size:26px;color:#F26B1D}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="brand"><img src="logo-dark.svg"><h1>Forge</h1></div>
  <h2>The batteries-included web framework for Go</h2>
  <p>Typed ORM, migrations, REST API and admin panel from one model definition.</p>
</div>
<div class="url">github.com/forgego/forge</div>
</body></html>
